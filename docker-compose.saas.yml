# Hardened multi-tenant deploy: Postgres + enforced auth + scope guard.
#   export INFILTR_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
#   export INFILTR_ALLOWLIST="*.yourscope.com,10.0.0.0/8"   # STRONGLY recommended
#   docker compose -f docker-compose.saas.yml up -d --build
#
# Scale the API horizontally: `docker compose -f docker-compose.saas.yml up -d --scale infiltr=3`
# (all replicas share Postgres; SSE progress is DB-backed so any replica can serve it).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infiltr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: infiltr
    volumes:
      - infiltr-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infiltr"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [infiltr]

  infiltr:
    build: .
    image: infiltr:latest
    environment:
      INFILTR_AUTH: "1"                       # enforced login / API keys
      INFILTR_OPEN_REGISTRATION: "0"          # only the bootstrap admin self-registers
      INFILTR_LOCK_OPTIONS: "1"               # users can't inject dangerous scan options
      INFILTR_BLOCK_PRIVATE: "1"              # SSRF guard: no scanning internal/private IPs
      INFILTR_DOCS: "0"                       # no public OpenAPI in prod
      INFILTR_SCHEDULER: "1"
      INFILTR_SECRET_KEY: "${INFILTR_SECRET_KEY:?set INFILTR_SECRET_KEY}"
      # Scope guard is REQUIRED (fails to boot otherwise). Set the hosts you're
      # authorized to scan, or set INFILTR_ALLOW_NO_ALLOWLIST=1 to accept an open scanner.
      INFILTR_ALLOWLIST: "${INFILTR_ALLOWLIST:-}"
      INFILTR_ALLOW_NO_ALLOWLIST: "${INFILTR_ALLOW_NO_ALLOWLIST:-}"
      INFILTR_BLOCKLIST: "${INFILTR_BLOCKLIST:-}"
      INFILTR_CORS: "${INFILTR_CORS:-}"       # explicit console origin(s), no wildcard
      INFILTR_MAX_CONCURRENT: "${INFILTR_MAX_CONCURRENT:-3}"
      INFILTR_GLOBAL_MAX_CONCURRENT: "${INFILTR_GLOBAL_MAX_CONCURRENT:-20}"
      INFILTR_RATE_LIMIT: "${INFILTR_RATE_LIMIT:-60}"
      DATABASE_URL: "postgresql+psycopg://infiltr:${POSTGRES_PASSWORD}@postgres:5432/infiltr"
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - NET_RAW      # nmap/masscan raw sockets; NET_ADMIN dropped (not needed)
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [infiltr]

volumes:
  infiltr-pg:

networks:
  infiltr:
    driver: bridge
